services:
  postgres:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_DB: algo_poc
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: algo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo"]
      interval: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7
    # T6 (bound Redis): without a maxmemory ceiling, unbounded streams
    # eventually OOM the Redis process itself and take the whole message bus
    # down silently (review Theme 6.3). `noeviction` means a write errors out
    # loudly once at the ceiling instead of Redis silently evicting whatever
    # key LRU picks next — for a stream carrying stream:approved_orders /
    # stream:kill, silent eviction of unacked entries is worse than a loud
    # write failure.
    #
    # 512mb is sized together with shared/redis_client.py's
    # DEFAULT_STREAM_MAXLEN (25_000), not picked independently — see the
    # comment above that constant for the full arithmetic. Short version:
    # worst case (9 primary streams simultaneously at cap, 1 KiB/entry) is
    # ~220 MiB, ~43% of this ceiling, leaving headroom for Redis overhead,
    # consumer-group PEL, and uncapped DLQ growth. RedisMemoryHigh
    # (config/alert_rules.yml) fires at 80% (410 MiB) — above that
    # provable worst case, so it only fires from genuinely abnormal growth,
    # and still well before writes would start failing at 100%.
    # tests/deploy/test_observability_healthchecks.py cross-checks this
    # value against DEFAULT_STREAM_MAXLEN so the two can't silently drift
    # apart again.
    #
    # PRE-MERGE OPERATOR CHECK (do not run this for me — see CLAUDE.md):
    # before this config lands on the operator's live stack, run
    # `redis-cli info memory` (used_memory_human) against the running
    # container. If current usage is already near/above 512mb, either raise
    # --maxmemory accordingly or let the new MAXLEN-capped publish() trim
    # the existing unbounded streams down over one full publish cycle each
    # BEFORE restarting Redis with this ceiling — `noeviction` means a
    # restart straight into an already-over-ceiling dataset fails new
    # writes immediately.
    #
    # NOTE for merge: T3 (message-bus lockdown) also sets `command:` on this
    # service (--requirepass). Combine both into one redis-server invocation,
    # e.g. ["redis-server", "--requirepass", "...", "--maxmemory", "512mb",
    # "--maxmemory-policy", "noeviction"] rather than keeping two `command:`
    # keys (compose only honors the last one).
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ALGO_DATABASE_URL=postgresql://algo:algo@postgres:5432/algo_poc
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  data-ingestion:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/data_ingestion/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:algo@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://redis:6379/0
      # IB Gateway runs on the host, not in a container; reach it via the host alias.
      - ALGO_IB_HOST=host.docker.internal
    # T6: container healthcheck via heartbeat-file freshness (see
    # shared/heartbeat.py) — catches a wedged-but-alive process (e.g. a
    # stuck IB call) that `restart: unless-stopped` alone misses, since that
    # only restarts on process exit. NOTE: plain `docker compose` does NOT
    # itself restart a container just because its healthcheck reports
    # unhealthy — this makes the wedge visible in `docker compose ps` /
    # `docker inspect` (and to any future watchdog reading container health,
    # same pattern as deploy/launchd/gateway_watchdog.sh), it does not by
    # itself cause a restart.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat('/var/algo/heartbeat').st_mtime<2700 else 1)"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 3m

  signal-generation:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/signal_generation/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      data-ingestion:
        condition: service_started
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:algo@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://redis:6379/0
    # T6: heartbeat-file healthcheck — see the data-ingestion comment above
    # for the full rationale. This service's Redis-consumer loop iterates
    # every 1-2s, so a much tighter freshness window than the poller above.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat('/var/algo/heartbeat').st_mtime<120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ml-model:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/ml_model/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      signal-generation:
        condition: service_started
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:algo@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://redis:6379/0
    # T6: heartbeat-file healthcheck — see the data-ingestion comment above.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat('/var/algo/heartbeat').st_mtime<120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  risk-management:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/risk_management/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      ml-model:
        condition: service_started
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:algo@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://redis:6379/0
    # T6: heartbeat-file healthcheck — see the data-ingestion comment above.
    # Particularly load-bearing here: this is the kill-switch consumer, and
    # the exact process most likely to matter if it silently wedges.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat('/var/algo/heartbeat').st_mtime<120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  execution:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/execution/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      risk-management:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Shared with the host Gateway watchdog: execution drops a marker here on
      # IB Error 1100 (server-connectivity lost), which the watchdog reads. The
      # API port stays open during a 1100, so the watchdog's port check is blind
      # to it without this signal. Defaults to the same ~/ibc tree the watchdog
      # keeps its other markers in.
      - ${ALGO_GATEWAY_STATE_DIR_HOST:-${HOME}/ibc/state}:/var/algo/state
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:algo@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://redis:6379/0
      # IB Gateway runs on the host, not in a container; reach it via the host alias.
      - ALGO_IB_HOST=host.docker.internal
      # Where execution writes the Error-1100 marker for the host watchdog.
      - ALGO_GATEWAY_STATE_DIR=/var/algo/state
    # T6: heartbeat-file healthcheck — see the data-ingestion comment above.
    # execution shares /var/algo/state with the host Gateway watchdog for a
    # different purpose (the IB Error-1100 marker); the heartbeat file below
    # lives in a separate, unmounted path so the two mechanisms can't collide.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat('/var/algo/heartbeat').st_mtime<120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:algo@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://redis:6379/0
      # Real key:role pairs from the (gitignored) .env file; without this the
      # API falls back to dev keys (refused in live mode).
      - API_KEYS=${API_KEYS:-}
    # T6: liveness probe via the unauthenticated /healthz route (see
    # services/api/app.py) rather than a heartbeat file — the API already
    # runs an HTTP server, so this reuses it instead of adding a second
    # liveness mechanism. Uses python (already in the image) instead of
    # curl, which python:3.12-slim does not include.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  notifications:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:algo@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://redis:6379/0
      # Telegram credentials from the (gitignored) .env file in the project root
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    # T6: heartbeat-file healthcheck — see the data-ingestion comment above.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat('/var/algo/heartbeat').st_mtime<120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Consumes stream:fills and projects fills into the durable ledger
  # (execution_fills, positions, order-intent FILLED status). Without this
  # service, fills publish to Redis but never persist — execution_fills stays
  # empty and the DB book never reflects real broker positions.
  portfolio-accounting:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/portfolio_accounting/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      execution:
        condition: service_started
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:algo@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://redis:6379/0
    # T6: heartbeat-file healthcheck — see the data-ingestion comment above.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat('/var/algo/heartbeat').st_mtime<120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
