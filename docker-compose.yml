services:
  postgres:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_DB: algo_poc
      POSTGRES_USER: algo
      # Required, no default: a fresh clone must not start with a known
      # password. Generate one (e.g. `openssl rand -hex 24`) and put it in
      # the gitignored `.env` — see `.env.example`. NOTE: Postgres only
      # applies this on first volume init; changing it for an EXISTING
      # `pgdata` volume needs a manual `ALTER USER algo WITH PASSWORD ...`
      # (see docker-compose.override.yml.example for the exact steps).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}
    ports:
      # Loopback-only: Postgres has no business being reachable off-host by
      # default. Remap in a local docker-compose.override.yml if you need a
      # different host binding (see docker-compose.override.yml.example).
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo"]
      interval: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7
    # Required, no default: an unauthenticated Redis on the bus that carries
    # stream:approved_orders and stream:kill is a live trading system with an
    # open front door. Generate a password (e.g. `openssl rand -hex 24`) and
    # put it in the gitignored `.env` — see `.env.example`.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example) before starting the stack}"]
    ports:
      # Loopback-only — see the postgres ports comment above.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example) before starting the stack}", "--no-auth-warning", "ping"]
      interval: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ALGO_DATABASE_URL=postgresql://algo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/algo_poc
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  data-ingestion:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/data_ingestion/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example) before starting the stack}@redis:6379/0
      # IB Gateway runs on the host, not in a container; reach it via the host alias.
      - ALGO_IB_HOST=host.docker.internal

  signal-generation:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/signal_generation/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      data-ingestion:
        condition: service_started
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example) before starting the stack}@redis:6379/0

  ml-model:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/ml_model/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      signal-generation:
        condition: service_started
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example) before starting the stack}@redis:6379/0

  risk-management:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/risk_management/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      ml-model:
        condition: service_started
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example) before starting the stack}@redis:6379/0

  execution:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/execution/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      risk-management:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Shared with the host Gateway watchdog: execution drops a marker here on
      # IB Error 1100 (server-connectivity lost), which the watchdog reads. The
      # API port stays open during a 1100, so the watchdog's port check is blind
      # to it without this signal. Defaults to the same ~/ibc tree the watchdog
      # keeps its other markers in.
      - ${ALGO_GATEWAY_STATE_DIR_HOST:-${HOME}/ibc/state}:/var/algo/state
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example) before starting the stack}@redis:6379/0
      # IB Gateway runs on the host, not in a container; reach it via the host alias.
      - ALGO_IB_HOST=host.docker.internal
      # Where execution writes the Error-1100 marker for the host watchdog.
      - ALGO_GATEWAY_STATE_DIR=/var/algo/state

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      # Loopback-only by default — see the postgres ports comment above.
      # Remote/LAN access to the kill-switch API needs a deliberate override.
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example) before starting the stack}@redis:6379/0
      # Real key:role pairs from the (gitignored) .env file; without this the
      # API falls back to dev keys (refused in live mode).
      - API_KEYS=${API_KEYS:-}

  notifications:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example) before starting the stack}@redis:6379/0
      # Telegram credentials from the (gitignored) .env file in the project root
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}

  # Consumes stream:fills and projects fills into the durable ledger
  # (execution_fills, positions, order-intent FILLED status). Without this
  # service, fills publish to Redis but never persist — execution_fills stays
  # empty and the DB book never reflects real broker positions.
  portfolio-accounting:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/portfolio_accounting/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      execution:
        condition: service_started
    environment:
      - ALGO_MODE=paper
      - ALGO_DATABASE_URL=postgresql://algo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/algo_poc
      - ALGO_REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example) before starting the stack}@redis:6379/0

volumes:
  pgdata:
