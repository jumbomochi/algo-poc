mode: paper  # live | backtest | paper

capital:
  paper:
    deployment_fraction: 1.0
    max_deployable_usd: 100000  # deploy full converted USD book (raised from 20k)
    entries_enabled: true
  live:
    deployment_fraction: 0.0
    max_deployable_usd: 0.0
    entries_enabled: false

currency:
  expected_base_currency: SGD
  trading_currency: USD
  max_fx_age_seconds: 300
  minimum_settled_usd_reserve: 0.0
  commission_per_share_usd: 0.005
  minimum_commission_usd: 1.0
  # KAN-111: every buy is capped at its sleeve's ledger cash (the cash the fill
  # projector refuses to overdraw), net of open buy orders, this run's accepted
  # buys and the order's estimated commission, less this buffer on the limit
  # notional. A DAY limit buy never fills above its limit live (execution only
  # cancels, it never reprices up), so 25 bps covers IB fee pass-throughs over
  # the commission estimate, and equals the backtest's dearest slippage tier so
  # the shadow/backtest — which size with the same rule — can never overdraw
  # either. Changing it changes the shadow's baseline_id.
  sleeve_cash_buffer_bps: 25.0

universe:
  # sleeves = union universe of the active sleeves (ingest exactly what the
  # strategies trade); sp500 = SP500_TOP100; custom = only custom_tickers.
  # custom_tickers are additive for non-custom sources.
  watchlist_source: sleeves
  custom_tickers: []
  # What bars are KEPT in ohlcv_daily, as opposed to what is traded (KAN-58).
  # membership = every current member of data/universe/sp500_membership.json
  # (503), so a name's history is already on disk by the time it leaves the
  # index — IB will not serve a departed name's bars back afterwards, which is
  # what left the point-in-time re-run BLOCKED at 11.28% coverage. Capture-only
  # names are persisted but NOT published to stream:market_data, so this does
  # not widen what signal_generation scores. Set to "none" to disable.
  capture_source: membership

data_ingestion:
  market_data_source: ib
  fundamentals_source: ib
  events_source: alpha_vantage
  polling_interval_minutes: 15
  ib_rate_limit_per_sec: 45  # buffer below IB's 50/sec
  backfill_years: 10
  # Most capture-only names fetched per cycle (KAN-58). IB's historical-data
  # ceiling is ~60 requests per rolling 10 minutes and the capture universe is
  # 503 names, so an uncapped cycle would sit an order of magnitude over it.
  # At 40 per 15-minute cycle the whole universe is covered in ~13 cycles
  # (~3.2h), comfortably inside a session, and a deferred name is picked up by
  # a later cycle with nothing lost — the lookback window still spans it.
  # The trading watchlist is never deferred. 0 disables the cap.
  capture_max_requests_per_cycle: 40

signals:
  staleness_thresholds:
    market_data_grace_hours: 4  # hours after expected session close
    fundamentals_days: 7
    events_hours: 48

sentiment:
  finnhub_news:
    enabled: true
  stocktwits:
    enabled: true
  reddit:
    enabled: true
    subreddits: [wallstreetbets, stocks, investing]
    posts_per_subreddit: 100
  discord:
    enabled: false   # flip on once servers/channels are confirmed
    channel_ids: []
  zscore_baseline_days: 60
  zscore_min_baseline_days: 20

ml_model:
  target_forward_weeks: 8
  target_buckets:
    sell: -0.05  # below -5% return
    buy: 0.05    # above +5% return
  min_training_samples: 200
  regime_detection_enabled: true

risk:
  position_entry_limit_pct: 5.0      # % of NAV
  sector_concentration_pct: 20.0      # % of NAV
  # % of NAV. Account-level margin headroom, as the risk service applies it.
  # NOT the binding limit for a sleeve: sleeves hold no margin — the fill
  # projector refuses any fill that takes a sleeve's cash below zero — so since
  # KAN-111 a sleeve's effective exposure limit is its ledger cash (about 100%
  # of its equity), enforced by the cash cap in run_paper / the risk service /
  # the backtest. The sleeves' own limits (run_paper.build_portfolios: momentum
  # 150, thematic_momentum 120, the rest 100) are left as they were: above 100
  # they cannot bind, because cash binds first.
  total_exposure_limit_pct: 150.0
  stop_loss_trailing_pct: 15.0        # trailing stop %
  drawdown_pause_pct: 10.0            # pause new buys
  drawdown_circuit_breaker_pct: 20.0  # liquidate all
  soft_ceiling_pct: 7.0               # notify only
  hard_ceiling_pct: 15.0              # auto-trim to soft_ceiling
  margin_warning_pct: 70.0            # of IB maintenance margin
  margin_critical_pct: 85.0           # of IB maintenance margin
  double_down_entry_limit_pct: 10.0   # of NAV
  passive_scan_interval_minutes: 30
  min_viable_fill_pct: 40.0           # partial fill threshold
  portfolio_beta_alert_threshold: 1.5
  correlation_alert_threshold: 0.7
  correlation_min_lookback_days: 60

execution:
  entry_buffer_pct: 0.3          # limit order buffer
  double_down_buffer_pct: 0.75   # wider buffer
  reprice_interval_minutes: 60
  max_reprice_attempts: 3
  order_submission_lag_seconds: 5  # simulated lag for backtest
  fractional_orders: false  # IBKR paper API rejects fractional (10243/10244); whole-share rounding applies
  # Broker-native protective stops (KAN-19) and the scan that verifies them
  # stay true (KAN-20). OFF until the epoch-v2 boundary (KAN-33): with the flag
  # off, behaviour is identical to before the feature existed — the verifier is
  # inert and the risk service's 30-minute scan keeps emitting software
  # stop-loss exits. Turning it off does NOT cancel stops already resting at IB —
  # those must be cancelled at the broker or they are left orphaned.
  # Requires ib.account_id to be set — a protective stop must name the
  # account it protects, or the backfill walks every account's positions.
  broker_stops_enabled: false
  broker_stops_tif: GTC           # survives a Gateway restart (KAN-18 spike)
  broker_stops_outside_rth: false # false = dormant outside RTH; gaps uncovered
  # KAN-94: reconnect a dropped IB session on a timer, not at the next order,
  # so a Gateway restart before the open cannot lose that day's fills.
  ib_liveness_interval_seconds: 60
  ib_disconnect_alert_seconds: 600  # one high page after 10 min disconnected
  # KAN-95: execution re-reads its own IB executions this often (and after any
  # reconnect) and books fills the live callback missed. IB serves executions
  # only since midnight SGT, so this also bounds what a pre-midnight miss loses.
  execution_sweep_interval_minutes: 15

ib:
  host: "127.0.0.1"
  live_port: 7496
  paper_port: 7497
  client_id: 1        # execution service — every concurrent client needs a distinct id
  data_client_id: 2   # data_ingestion service
  # The exact account execution is allowed to trade, e.g. "DUN551088". The
  # DU/U prefix guard proves the account TYPE, not its identity — set this and
  # the session must serve exactly this account, and every order is stamped
  # with it. Override per environment with ALGO_IB_ACCOUNT_ID.
  # null = unpinned (prefix guard only).
  account_id: null

notifications:
  slack_enabled: false
  email_enabled: false
  sms_enabled: false
  telegram_enabled: true  # credentials via TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID env vars

database:
  url: "postgresql://algo:algo@localhost:5432/algo_poc"

redis:
  url: "redis://localhost:6379/0"

observability:
  prometheus_port: 9090
  tracing_enabled: false

research:
  shadow_enabled: false  # observational only; never changes signals or orders
  factor_ids:
    - price_momentum_126d
    - high_52w
    - low_volatility_63d
    - liquidity_20d

divergence:
  # The baseline of record: the artifact scripts/divergence_monitor.py scores
  # live paper equity against (KAN-51). Stated here rather than discovered by
  # filename recency in output/ — recency made the baseline a filesystem
  # accident, replaced every Tuesday by the weekly refresh with nothing saying
  # so. deploy/launchd/run_divergence.sh passes this as --backtest --pinned; an
  # absent or shape-mismatched pin exits 3 and alerts rather than quietly
  # scoring against whatever is newest.
  #
  # Re-pin at a rung change. See docs/operations/backtest-baseline.md,
  # "The pinned baseline of record".
  baseline_pin: output/backtest_multi_20260915_102125.json

  # The Rung-0 baseline of record (KAN-60, D21): momentum only, whole shares,
  # the $1 floor, USD 3,700. Reference for Rung-0 economics and divergence
  # thresholds — NOT the edge pin above and NOT the nightly drift feed (the
  # rolling shadow, D19). Resolve with scripts/ops/baseline_pin.py --rung0.
  rung0_baseline_pin: output/baselines/rung0_momentum_20260925.json

  # Earliest live equity date admissible for grading (KAN-83). Live equity from
  # before a re-baseline is not comparable to anything: equity_snapshots carries
  # 2026-07-28..07-31 with negative sleeve equity and a total a third of
  # reality, written between the 2026-07-25 bulk position close and the
  # 2026-08-01 Path A re-baseline. On 2026-09-12 the sliding 30-day window
  # reached them and reported momentum +498.9% and AGGREGATE +207.4% as a
  # BREACH — none of it drift.
  #
  # Inclusive: names the first ADMISSIBLE session. Superseded by an open
  # gate_epochs row once epoch v2 starts (KAN-33).
  live_history_from: 2026-08-01

data:
  # Fundamentals / earnings caches read by quality_value and earnings_drift
  # (KAN-109). Relative paths resolve against the repository root, NOT the
  # working directory, so the paper run, the weekly backtest refresh and the
  # fetchers all read and write one location. The caches are gitignored: the
  # deploy clone (KAN-72) started with an empty data/cache/ on 2026-09-24 and
  # both sleeves ran with no data, silently, until this check existed.
  cache_dir: data/cache
  # A missing cache, or one stale by either rule below, marks the dependent
  # sleeve DATA-DEGRADED for the run: one alert, no new entries from that
  # sleeve and no rank-replacement exits (stops and time exits still run),
  # and its shadow is not graded. A cache written
  # before fetched_at existed has an unknown age and counts as stale.
  fundamentals:
    max_fetch_age_days: 14         # weekly refresh, one miss tolerated
    max_period_age_days: 167       # longest quarter (92d) + 75d 10-K deadline
    max_stale_ticker_fraction: 0.2 # sleeve-kill-criteria.md's 20% bound
  earnings:
    max_fetch_age_days: 2          # = the lookup window: refresh daily
    # Alpha Vantage refresh (KAN-110, scripts/fetch_earnings.py): a full run
    # at 04:45 SGT and a top-up at 05:05 (local.algo-earnings-refresh /
    # local.algo-earnings-topup), every day. Sized for the FREE tier (25
    # requests/day): 1 calendar + 16 EARNINGS at 04:45, at most 4 at 05:05 —
    # 21, leaving 4 for a hand-run. For a paid plan raise calls_per_run and
    # drop min_interval_seconds to the plan's per-minute limit (75/min -> 0.9).
    refresh:
      calls_per_run: 16
      topup_calls: 4
      topup_recent_days: 1
      topup_refetch_minutes: 10
      min_interval_seconds: 13
      refusal_exclude_after_days: 3
      max_consecutive_errors: 3
      recent_days: 4
      refetch_after_hours: 20
      calendar_horizon: 3month
      calendar_retain_days: 14
      symbol_overrides:            # universe ticker -> AV symbol (renamed)
        MMC: MRSH
        FI: FISV
