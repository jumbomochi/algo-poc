global:
  scrape_interval: 15s
  evaluation_interval: 15s

# T6: alert rules live in alert_rules.yml (mounted alongside this file in
# docker-compose.observability.yml). Evaluated and visible at
# http://localhost:9091/alerts.
rule_files:
  - "alert_rules.yml"

# KAN-14: the follow-up T6 deferred. Until this block existed, every rule in
# alert_rules.yml fired into Prometheus's own web UI and stopped there — a
# monitor nobody watches. `alertmanager` is the service in
# docker-compose.observability.yml; see config/alertmanager.yml for why
# delivery does not reuse the notifications service.
#
# Verify after `up`: http://localhost:9091/api/v1/alertmanagers should list
# alertmanager:9093 under activeAlertmanagers.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "data-ingestion"
    static_configs:
      - targets: ["data-ingestion:9090"]

  - job_name: "signal-generation"
    static_configs:
      - targets: ["signal-generation:9090"]

  - job_name: "ml-model"
    static_configs:
      - targets: ["ml-model:9090"]

  - job_name: "risk-management"
    static_configs:
      - targets: ["risk-management:9090"]

  - job_name: "execution"
    static_configs:
      - targets: ["execution:9090"]

  - job_name: "api"
    static_configs:
      - targets: ["api:9090"]

  - job_name: "notifications"
    static_configs:
      - targets: ["notifications:9090"]

  # T6: was missing entirely — portfolio-accounting projects stream:fills
  # into the durable ledger; without this job its metrics endpoint (wired in
  # services/portfolio_accounting/runner.py) was never scraped.
  - job_name: "portfolio-accounting"
    static_configs:
      - targets: ["portfolio-accounting:9090"]

  # T6: redis_exporter sidecar (docker-compose.observability.yml) — gives us
  # redis_memory_used_bytes/redis_memory_max_bytes (the "redis-memory" alert)
  # and, via --check-streams-pattern, per-stream redis_stream_length /
  # redis_stream_entries_added (the "dlq-depth" and "stream-idle" alerts)
  # with zero app-side polling code.
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
