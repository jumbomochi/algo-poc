name: tests

on:
  # develop is the integration branch: every PR merges there first and is
  # verified before it is promoted to main. Two individually-green PRs can
  # still conflict semantically once both are on develop, and nothing catches
  # that unless the branch itself is built after the merge.
  push:
    branches: [main, develop]
  pull_request:

# Cancel superseded pull_request runs only. Pushes to main and develop always
# run to completion: a branch build is the record that the merged tree is
# green, and a cancelled run leaves that record ambiguous.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No service containers: the suite is self-contained. Migration tests
      # use a throwaway sqlite database in tmp_path, and nothing skips on a
      # missing postgres/redis/docker — so a passing run here means the whole
      # suite actually ran, not that most of it was skipped.
      # tests/deploy/test_launchd_secrets_keychain.py drives the launchd secret
      # loader through a real zsh to prove it refuses to be sourced from one
      # (the 2026-08-12 outage). The runner image has no zsh, and the test
      # skips itself without one — install it so CI actually runs it.
      - name: Install zsh (required by the launchd loader tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install locked dev dependencies
        run: pip install -r requirements-dev.lock
      - name: Install the project (no deps — the lockfile owns versions)
        run: pip install --no-deps -e .
      - name: Run the suite
        run: pytest -q

  alertmanager-config:
    name: amtool check-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Pinned to the same tag as the image in
      # docker-compose.observability.yml — validating the config with a
      # different Alertmanager version than the one that runs it is a green
      # check that proves nothing.
      # tests/deploy/test_observability_healthchecks.py asserts the two stay
      # in step.
      - name: Install amtool (pinned to the alertmanager image tag)
        env:
          ALERTMANAGER_VERSION: "0.27.0"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" \
            | tar -xz
          sudo install "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool" /usr/local/bin/amtool
      # config/alertmanager.yml is a secret-free template (the entrypoint
      # renders the token and chat_id at container start), so it is
      # checkable exactly as committed. A malformed route silences alerts,
      # and the only way to notice that at runtime is an alert that never
      # arrives — which is indistinguishable from a healthy system.
      - name: Check the Alertmanager routing config
        run: amtool check-config config/alertmanager.yml
