name: tests

on:
  # develop is the integration branch: every PR merges there first and is
  # verified before it is promoted to main. Two individually-green PRs can
  # still conflict semantically once both are on develop, and nothing catches
  # that unless the branch itself is built after the merge.
  push:
    branches: [main, develop]
  pull_request:

# Cancel superseded pull_request runs only. Pushes to main and develop always
# run to completion: a branch build is the record that the merged tree is
# green, and a cancelled run leaves that record ambiguous.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No service containers: the suite is self-contained. Migration tests
      # use a throwaway sqlite database in tmp_path, and nothing skips on a
      # missing postgres/redis/docker — so a passing run here means the whole
      # suite actually ran, not that most of it was skipped.
      # tests/deploy/test_launchd_secrets_keychain.py drives the launchd secret
      # loader through a real zsh to prove it refuses to be sourced from one
      # (the 2026-08-12 outage). The runner image has no zsh, and the test
      # skips itself without one — install it so CI actually runs it.
      - name: Install zsh (required by the launchd loader tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install locked dev dependencies
        run: pip install -r requirements-dev.lock
      - name: Install the project (no deps — the lockfile owns versions)
        run: pip install --no-deps -e .
      - name: Run the suite
        run: pytest -q

  alertmanager-config:
    name: amtool check-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Pinned to the same tag as the image in
      # docker-compose.observability.yml — validating the config with a
      # different Alertmanager version than the one that runs it is a green
      # check that proves nothing.
      # tests/deploy/test_observability_healthchecks.py asserts the two stay
      # in step.
      - name: Install amtool (pinned to the alertmanager image tag)
        env:
          ALERTMANAGER_VERSION: "0.27.0"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" \
            | tar -xz
          sudo install "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool" /usr/local/bin/amtool
      # config/alertmanager.yml is a secret-free template (the entrypoint
      # renders the token and chat_id at container start), so it is
      # checkable exactly as committed. A malformed route silences alerts,
      # and the only way to notice that at runtime is an alert that never
      # arrives — which is indistinguishable from a healthy system.
      - name: Check the Alertmanager routing config
        run: amtool check-config config/alertmanager.yml
      # KAN-15 (AC4). check-config only proves the file parses. This proves
      # intent: every severity a rule can carry still lands on the Telegram
      # receiver, and the always-firing Watchdog lands on the dead-man webhook
      # instead of Telegram — a Watchdog routed to Telegram would page every
      # 5 minutes forever and get the bot muted, taking every real alert with
      # it.
      - name: Check every alert still routes where it is meant to
        run: |
          set -euo pipefail
          for severity in critical warning info; do
            receiver=$(amtool config routes test --config.file=config/alertmanager.yml "severity=$severity")
            if [ "$receiver" != "telegram" ]; then
              echo "severity=$severity routes to '$receiver', expected 'telegram'" >&2
              exit 1
            fi
          done
          watchdog=$(amtool config routes test --config.file=config/alertmanager.yml alertname=Watchdog severity=none)
          if [ "$watchdog" != "deadman" ]; then
            echo "the Watchdog routes to '$watchdog', expected 'deadman'" >&2
            exit 1
          fi

  # KAN-15 (P1-12) — the alert rules are unit-tested artifacts, not
  # reviewed-by-eye YAML. The rule this replaced
  # (`increase(approved_orders[60m]) == 0`) was true for ~23 hours of every
  # day and no amount of reading caught it; replaying a normal weekend through
  # the rules catches it in one second.
  alert-rules:
    name: promtool test rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Pinned to the same tag as the prometheus image in
      # docker-compose.observability.yml, for the same reason the amtool job
      # is — testing rules with a different evaluator than the one that runs
      # them is a green check that proves nothing.
      # tests/deploy/test_alert_rules.py asserts the two stay in step.
      - name: Install promtool (pinned to the prometheus image tag)
        env:
          PROMETHEUS_VERSION: "2.51.0"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar -xz
          sudo install "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
      - name: Check the rules parse
        run: promtool check rules config/alert_rules.yml
      - name: Replay a quiet weekend and every failure mode through the rules
        run: promtool test rules tests/deploy/alert_rules_test.yml
