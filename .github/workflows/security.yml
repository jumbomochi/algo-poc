name: security

on:
  # See tests.yml for why develop is built on push as well as on PR.
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Weekly scan for newly-disclosed CVEs in already-pinned dependencies.
    # GitHub only fires schedule triggers on the default branch, so this runs
    # from main regardless of what is listed above — adding develop to the
    # push list does not give develop its own weekly scan.
    - cron: "0 6 * * 1"

# Cancel superseded pull_request runs only; see tests.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    name: pip-audit (dependency vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked dependencies (includes pip-audit itself)
        run: pip install -r requirements-dev.lock
      # Audit both: requirements.lock is what every service Dockerfile
      # actually installs (see COPY requirements.lock + pip install --no-deps
      # -r requirements.lock in each Dockerfile) — that's the one that
      # matters for the deployed system. requirements-dev.lock is audited
      # too since it's what CI/local dev installs.
      - name: Audit the deployed (production) lockfile
        run: pip-audit -r requirements.lock
      - name: Audit the dev/CI lockfile
        run: pip-audit -r requirements-dev.lock

  lockfile-freshness:
    name: lockfile matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      # Recompile IN PLACE, over the committed lockfiles. That is what makes
      # this job deterministic: uv treats existing pins as preferences, so an
      # upstream release of any dependency does not by itself turn the job
      # red — only a change to pyproject.toml (or a pin that no longer
      # satisfies it) does. Compiling to a fresh path instead, as this job
      # used to, resolves newest-available every run and goes red on its own.
      # --universal --python-version 3.12 pin the other two axes: without
      # them the resolution varies by host platform and interpreter version.
      # See docs/operations/dependency-lockfile.md.
      - name: Recompile the lockfiles in place
        run: |
          uv pip compile pyproject.toml --universal --python-version 3.12 -o requirements.lock
          uv pip compile pyproject.toml --extra dev --universal --python-version 3.12 -o requirements-dev.lock
      # git diff (not diff -q) so the log shows exactly which pins are stale,
      # and one invocation covering both files so neither can hide behind the
      # other's early exit.
      - name: Check the lockfiles are consistent with pyproject.toml
        run: |
          git diff --exit-code -- requirements.lock requirements-dev.lock || {
            echo "::error::Lockfiles are inconsistent with pyproject.toml — see the diff above. Regenerate with the two commands in docs/operations/dependency-lockfile.md" >&2
            exit 1
          }
