[project]
name = "algo-poc"
version = "0.1.0"
description = "Automated US equities trading bot"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "redis>=5.0,<6.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "httpx>=0.27,<1.0",
    "ib_insync>=0.9,<1.0",
    "lightgbm>=4.0,<5.0",
    # services/ml_model/trainer.py imports sklearn.model_selection and
    # sklearn.metrics; lightgbm does not pull scikit-learn in. Undeclared
    # until KAN-36, which only surfaced once CI installed from the lockfile
    # instead of a long-lived dev environment that happened to have it.
    "scikit-learn>=1.4,<2.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<2.0",
    "exchange-calendars>=4.0,<5.0",
    "pyyaml>=6.0,<7.0",
    "structlog>=24.0,<25.0",
    "opentelemetry-api>=1.20,<2.0",
    "opentelemetry-sdk>=1.20,<2.0",
    "prometheus-client>=0.20,<1.0",
    "joblib>=1.3,<2.0",
    "plotly>=5.18,<6.0",
    "vaderSentiment>=3.3,<4.0",
    "praw>=7.7,<8.0",
    "scipy>=1.11,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "fakeredis>=2.21",
    "factory-boy>=3.3",
    "testcontainers[postgres,redis]>=3.7",
    "pip-audit>=2.7,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "services", "backtest", "sentiment", "research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
